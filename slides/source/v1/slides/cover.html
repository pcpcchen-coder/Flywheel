<aside>開場一句話：AI 訓練機房的用電不是一條平線，而是每秒來回一次、幅度幾十 MW 的方波。我們的提案是用飛輪而不是鋰電，把這個方波在電表內吸收掉。今天會講三件事：問題有多嚴重、飛輪怎麼控制、以及需要您核准的 PoC。右下角這個圖就是整份簡報的重點：左邊鋸齒進去，經過飛輪，右邊電網只看到一條平線。</aside>
